name: ci

# Quality gate on every push / PR: lint, strict types, and the full test suite.
# Companion to version-guard.yml (which enforces the MAJOR.SPRINT.HOTFIX bump).
# No secrets needed — the suite is fully offline (mocked HTTP, injected resolvers).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (provisions Python from pyproject's requires-python)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy --strict)
        run: uv run mypy halia

      - name: Tests (pytest)
        run: uv run pytest -q
