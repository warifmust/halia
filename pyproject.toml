[project]
name = "halia"
dynamic = ["version"]
description = "A trust-first general agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "fpdf2>=2.7",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
    "prompt-toolkit>=3.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
cua = [
    # Pinned exactly, not as a range: 0.34.0 made `cursor_motion` a required field
    # on StartSessionInput, which halia does not pass — every cua_* tool fails at
    # session start there. The 0.30–0.33 line shares the compatible signature but
    # has never been run, so installs stay on the validated build. Keep in step
    # with CUA_DRIVER_SPEC in halia/computer/cua_backend.py.
    "cua-driver==0.29.1",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
halia = "halia.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: halia/__init__.py `__version__`.
# Scheme: MAJOR.SPRINT.HOTFIX — small change → bump HOTFIX; big change → bump SPRINT, reset HOTFIX.
[tool.hatch.version]
path = "halia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["halia"]
artifacts = [
    "halia/assets/fonts/*.ttf",  # bundle the Unicode PDF font
    "halia/assets/js/mermaid.min.js",  # bundle mermaid.js for offline diagram HTML render
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "fpdf.*",
    "pptx.*",
    "docx.*",
    # Optional deps (installed only with the `mcp` extra) — absent in CI's `uv sync`.
    "mcp",
    "mcp.*",
    "httpx2",
    "pydantic",
    "pydantic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
