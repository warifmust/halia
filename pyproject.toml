[project]
name = "halia"
dynamic = ["version"]
description = "A trust-first general agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "fpdf2>=2.7",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
    "prompt-toolkit>=3.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49",
]
cua = [
    "cua-driver>=0.1",
]

[project.scripts]
halia = "halia.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: halia/__init__.py `__version__`.
# Scheme: MAJOR.SPRINT.HOTFIX — small change → bump HOTFIX; big change → bump SPRINT, reset HOTFIX.
[tool.hatch.version]
path = "halia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["halia"]
artifacts = [
    "halia/assets/fonts/*.ttf",  # bundle the Unicode PDF font
    "halia/assets/js/mermaid.min.js",  # bundle mermaid.js for offline diagram HTML render
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "fpdf.*", "pptx.*", "docx.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
