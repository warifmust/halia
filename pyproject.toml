[project]
name = "halia"
version = "0.1.0"
description = "A trust-first general agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "fpdf2>=2.7",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
]

[project.scripts]
halia = "halia.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halia"]
artifacts = ["halia/assets/fonts/*.ttf"]  # bundle the Unicode PDF font

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "fpdf.*", "pptx.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
